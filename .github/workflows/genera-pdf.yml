name: Genera PDF Flowgorithm

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  genera-pdf:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[pdf]')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Scarica i sorgenti
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Installa Typst
        uses: typst-community/setup-typst@v5
        with:
          typst-version: '0.15.1'
      - name: Installa i font dei diagrammi
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y fonts-liberation
      - name: Compila le dispense
        run: bash scripts/build.sh
      - name: Pubblica il PDF di teoria sui diagrammi di flusso
        uses: actions/upload-artifact@v4
        with:
          name: 1-1-teoria-diagrammi-di-flusso
          path: dist/1-1-teoria-diagrammi-di-flusso.pdf
          if-no-files-found: error
          retention-days: 90
      - name: Pubblica il PDF degli esercizi sui diagrammi di flusso
        uses: actions/upload-artifact@v4
        with:
          name: 1-2-esercizi
          path: dist/1-2-esercizi.pdf
          if-no-files-found: error
          retention-days: 90
      - name: Pubblica il PDF di teoria di Flowgorithm
        uses: actions/upload-artifact@v4
        with:
          name: 2-1-teoria-flowgorithm
          path: dist/2-1-teoria-flowgorithm.pdf
          if-no-files-found: error
          retention-days: 90
      - name: Pubblica il PDF degli esercizi di Flowgorithm
        if: hashFiles('dist/2-2-esercizi.pdf') != ''
        uses: actions/upload-artifact@v4
        with:
          name: 2-2-esercizi
          path: dist/2-2-esercizi.pdf
          if-no-files-found: error
          retention-days: 90
