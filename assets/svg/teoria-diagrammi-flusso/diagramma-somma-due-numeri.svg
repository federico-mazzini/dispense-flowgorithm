<svg xmlns="http://www.w3.org/2000/svg" width="800" height="900" viewBox="0 0 800 900">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#475569"/></marker></defs>
<rect width="800" height="900" rx="24" fill="#ffffff"/>
<text x="400" y="48" font-family="Arial,sans-serif" font-size="27" font-weight="700" text-anchor="middle" fill="#1e293b">Somma di due numeri</text>
<rect x="285" y="75" width="230" height="64" rx="32" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
<text x="400" y="115" font-family="Arial,sans-serif" font-size="23" font-weight="700" text-anchor="middle" fill="#166534">INIZIO</text>
<path d="M400 139 V181" stroke="#475569" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<polygon points="300,192 520,192 490,254 270,254" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
<text x="395" y="231" font-family="Arial,sans-serif" font-size="22" text-anchor="middle" fill="#1d4ed8">Leggi numero1</text>
<path d="M395 254 V302" stroke="#475569" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<polygon points="300,314 520,314 490,376 270,376" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
<text x="395" y="353" font-family="Arial,sans-serif" font-size="22" text-anchor="middle" fill="#1d4ed8">Leggi numero2</text>
<path d="M395 376 V426" stroke="#475569" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<rect x="230" y="438" width="340" height="78" rx="4" fill="#ffedd5" stroke="#ea580c" stroke-width="3"/>
<text x="400" y="485" font-family="Arial,sans-serif" font-size="22" text-anchor="middle" fill="#9a3412">somma = numero1 + numero2</text>
