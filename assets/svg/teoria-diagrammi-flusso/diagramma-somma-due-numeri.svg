<polygon points="300,578 520,578 490,640 270,640" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
<text x="395" y="617" font-family="Arial,sans-serif" font-size="22" text-anchor="middle" fill="#1d4ed8">Mostra somma</text>
<path d="M395 640 V692" stroke="#475569" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<rect x="285" y="704" width="230" height="64" rx="32" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
<text x="400" y="744" font-family="Arial,sans-serif" font-size="23" font-weight="700" text-anchor="middle" fill="#166534">FINE</text>
<text x="400" y="824" font-family="Arial,sans-serif" font-size="17" text-anchor="middle" fill="#64748b">Prima si acquisiscono entrambi i numeri, poi si calcola la somma.</text>
