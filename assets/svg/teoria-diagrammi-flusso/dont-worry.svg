<polyline fill="none" stroke="#40617a" stroke-width="2.8" stroke-linejoin="round" points="142,73 135,73 135,148"/><polygon fill="#40617a" points="135,148 131.00,138.00 139.00,138.00"/>
<text x="106" y="120.8" text-anchor="middle" font-family="Arial, Liberation Sans, sans-serif" font-size="20" font-weight="700" fill="#173652">Yes</text>
<polyline fill="none" stroke="#40617a" stroke-width="2.8" stroke-linejoin="round" points="398,73 490,73 490,290 364,290 364,316"/><polygon fill="#40617a" points="364,316 360.00,306.00 368.00,306.00"/>
<text x="449" y="62.8" text-anchor="middle" font-family="Arial, Liberation Sans, sans-serif" font-size="20" font-weight="700" fill="#173652">No</text>
