<polygon points="135,148 258,208 135,268 12,208" fill="#fae9de" stroke="#b98967" stroke-width="2.6"/>
<text x="135" y="194.06" text-anchor="middle" font-family="Arial, Liberation Sans, sans-serif" font-size="17" font-weight="700" fill="#173652">Can you do</text>
<text x="135" y="213.78" text-anchor="middle" font-family="Arial, Liberation Sans, sans-serif" font-size="17" font-weight="700" fill="#173652">something</text>
<text x="135" y="233.5" text-anchor="middle" font-family="Arial, Liberation Sans, sans-serif" font-size="17" font-weight="700" fill="#173652">about it?</text>
</g>
<polyline fill="none" stroke="#40617a" stroke-width="2.8" stroke-linejoin="round" points="135,268 135,295 237,295 237,316"/><polygon fill="#40617a" points="237,316 233.00,306.00 241.00,306.00"/>
<text x="165" y="290.12" text-anchor="middle" font-family="Arial, Liberation Sans, sans-serif" font-size="18" font-weight="700" fill="#173652">Yes</text>
<polyline fill="none" stroke="#40617a" stroke-width="2.8" stroke-linejoin="round" points="258,208 305,208 305,316"/><polygon fill="#40617a" points="305,316 301.00,306.00 309.00,306.00"/>
<text x="288" y="195.12" text-anchor="middle" font-family="Arial, Liberation Sans, sans-serif" font-size="18" font-weight="700" fill="#173652">No</text>
