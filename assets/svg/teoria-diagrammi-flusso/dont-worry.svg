<polygon points="168,316 450,316 432,368 150,368" fill="#e4effb" stroke="#6085ab" stroke-width="2.6"/>
<text x="300" y="349.48" text-anchor="middle" font-family="Arial, Liberation Sans, sans-serif" font-size="22" font-weight="400" fill="#173652">Then don’t worry.</text>
