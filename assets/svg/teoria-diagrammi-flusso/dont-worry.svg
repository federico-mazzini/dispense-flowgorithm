<svg xmlns="http://www.w3.org/2000/svg" width="560" height="376" viewBox="0 0 560 376">
<title>Do you have a problem?</title>
<g>
<polygon points="270,8 398,73 270,138 142,73" fill="#fae9de" stroke="#b98967" stroke-width="2.6"/>
<text x="270" y="68.44" text-anchor="middle" font-family="Arial, Liberation Sans, sans-serif" font-size="19" font-weight="700" fill="#173652">Do you have</text>
<text x="270" y="90.48" text-anchor="middle" font-family="Arial, Liberation Sans, sans-serif" font-size="19" font-weight="700" fill="#173652">a problem?</text>
