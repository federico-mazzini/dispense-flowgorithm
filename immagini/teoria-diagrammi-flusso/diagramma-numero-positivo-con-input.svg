<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="720" viewBox="0 0 1000 720">
<rect width="1000" height="720" fill="#ffffff"/>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#243247;font-size:22px;text-anchor:middle}.flow{fill:none;stroke:#475569;stroke-width:3;marker-end:url(#arrow)}.terminal{fill:#d9ead3;stroke:#6aa84f;stroke-width:2.5}.io{fill:#d9eaf7;stroke:#6fa8dc;stroke-width:2.5}.decision{fill:#fff2cc;stroke:#d6b656;stroke-width:2.5}.branch{font-weight:bold;font-size:20px}</style>
<rect x="405" y="25" width="190" height="54" rx="27" class="terminal"/><text x="500" y="59">INIZIO</text>
<path class="flow" d="M500 79 V118"/>
