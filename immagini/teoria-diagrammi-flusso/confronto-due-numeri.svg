<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="760" viewBox="0 0 1000 760">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#333"/></marker></defs>
<rect width="100%" height="100%" fill="#fff"/>
<style>text{font-family:Arial,sans-serif;fill:#222;font-size:22px;text-anchor:middle}.box{fill:#f4f7fb;stroke:#333;stroke-width:2}.decision{fill:#fff4d6;stroke:#333;stroke-width:2}.out{fill:#e7f4e4;stroke:#333;stroke-width:2}.line{fill:none;stroke:#333;stroke-width:2.5;marker-end:url(#arrow)}.label{font-size:20px;font-weight:bold}</style>
<rect class="box" x="375" y="25" width="250" height="58" rx="28"/><text x="500" y="61">INIZIO</text>
<path class="line" d="M500 83 V115"/>
<rect class="box" x="325" y="115" width="350" height="66" rx="6"/><text x="500" y="143">Leggi i due numeri</text><text x="500" y="168">a e b</text>
<path class="line" d="M500 181 V220"/>
<polygon class="decision" points="500,220 630,280 500,340 370,280"/><text x="500" y="287">a &gt; b?</text>
<path class="line" d="M370 280 H200 V365"/>
<text class="label" x="270" y="265">SÌ</text>
<rect class="out" x="70" y="365" width="260" height="66" rx="6"/><text x="200" y="405">a è maggiore di b</text>
<path class="line" d="M630 280 H800 V365"/>
<text class="label" x="730" y="265">NO</text>
<polygon class="decision" points="800,365 920,425 800,485 680,425"/><text x="800" y="432">a &lt; b?</text>
<path class="line" d="M680 425 H540 V540"/>
<text class="label" x="610" y="410">SÌ</text>
<rect class="out" x="405" y="540" width="270" height="66" rx="6"/><text x="540" y="580">b è maggiore di a</text>
<path class="line" d="M800 485 V540"/>
<text class="label" x="835" y="516">NO</text>
<rect class="out" x="700" y="540" width="220" height="66" rx="6"/><text x="810" y="580">a e b sono uguali</text>
<path class="line" d="M200 431 V665 H500 V700"/>
<path class="line" d="M540 606 V700"/>
<path class="line" d="M810 606 V665 H500"/>
<rect class="box" x="375" y="700" width="250" height="45" rx="22"/><text x="500" y="729">FINE</text>
</svg>